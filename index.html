<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSPC Web Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cyber-bg">
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
  </div>

  <div class="container">
    <div class="header">
      <h1>⚡ SSPC Web Tools</h1>
      <p class="subtitle">— SSPC ON TOP —</p>
      <div class="invite-link">
        <a href="https://discord.gg/cnyEJQyyPw" target="_blank" class="join-link">join new SSPC！！</a>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tabSpam">⚔️ Spam Tool</button>
      <button class="tab-btn" data-tab="tabChecker">🔍 Token Checker</button>
    </div>

    <!-- ===== Spam Tool ===== -->
    <div id="tabSpam" class="tab-content active">
      <div class="card">
        <h2>⚔️ Spam Tool</h2>

        <div class="field">
          <label>トークン</label>
          <div class="token-input-wrapper">
            <textarea id="spamTokens" placeholder="カンマ / 改行 / スペースで区切る"></textarea>
            <button type="button" class="toggle-visibility" data-target="spamTokens">👁️</button>
          </div>
        </div>

        <div class="field">
          <label>サーバーID</label>
          <input id="guildId" placeholder="123456789012345678">
        </div>

        <div class="field">
          <label>チャンネルID</label>
          <textarea id="channelIds" placeholder="カンマ / 改行 / スペースで区切る"></textarea>
          <button id="autoChannel" class="btn-secondary">📡 チャンネル自動取得</button>
        </div>

        <div class="field">
          <label>メッセージ内容</label>
          <textarea id="message" placeholder="送信するメッセージを入力"></textarea>
        </div>

        <div class="checkbox-group">
          <label><input type="checkbox" id="mentionEveryone"> 全体メンション</label>
          <label><input type="checkbox" id="randomize"> ランダマイズ</label>
        </div>

        <div class="accordion">
          <div class="accordion-header" data-target="accordionSettings">
            <span>▶ 送信設定</span>
          </div>
          <div class="accordion-body" id="accordionSettings">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="settingsEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">送信設定を有効にする</span>
            </div>
            <div class="row">
              <div class="field">
                <label>送信間隔 (MS)</label>
                <input id="sendInterval" type="number" value="1000">
              </div>
              <div class="field">
                <label>メッセージ間遅延 (MS)</label>
                <input id="messageDelay" type="number" value="500">
              </div>
            </div>
            <div class="field">
              <label>RATE LIMIT RETRY</label>
              <input id="rateLimitRetry" type="number" value="3">
            </div>
            <div class="field">
              <label>送信上限 (0=無制限)</label>
              <input id="limit" type="number" value="0">
            </div>
          </div>
        </div>

        <div class="accordion">
          <div class="accordion-header" data-target="accordionMention">
            <span>▶ ユーザーメンション</span>
          </div>
          <div class="accordion-body" id="accordionMention">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="mentionEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">ユーザーメンションを有効にする</span>
            </div>
            <div class="field">
              <label>USER ID</label>
              <textarea id="userIds" placeholder="改行区切り"></textarea>
            </div>
            <div class="row">
              <div class="field">
                <label>MESSAGE LIMIT</label>
                <input id="messageLimit" type="number" value="100">
              </div>
              <div class="field">
                <label>1メッセージあたりのメンション数</label>
                <input id="mentionsPerMessage" type="number" value="1">
              </div>
            </div>
            <button id="autoUsers" class="btn-secondary">👥 User ID 自動取得</button>
          </div>
        </div>

        <div class="accordion">
          <div class="accordion-header" data-target="accordionReply">
            <span>▶ リプライ設定</span>
          </div>
          <div class="accordion-body" id="accordionReply">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="replyEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">リプライ設定を有効にする</span>
            </div>
            <div class="field">
              <label>過去何メッセージまで参照するか</label>
              <input id="replyHistoryLimit" type="number" value="50">
            </div>
          </div>
        </div>

        <div class="accordion">
          <div class="accordion-header" data-target="accordionPoll">
            <span>▶ 投票</span>
          </div>
          <div class="accordion-body" id="accordionPoll">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="pollEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">投票を有効にする</span>
            </div>
            <div class="field">
              <label>❓ 質問</label>
              <input id="pollQuestion" placeholder="質問の内容は？" maxlength="300">
              <span id="pollCharCount">0 / 300</span>
            </div>
            <div class="field">
              <label>📝 回答（改行区切り）</label>
              <textarea id="pollAnswers" rows="3" placeholder="回答1&#10;回答2"></textarea>
            </div>
            <div class="row">
              <div class="field">
                <label>⏱ 期間（時間）</label>
                <input id="pollDuration" type="number" value="24" min="1" max="336">
              </div>
            </div>
            <div class="checkbox-group">
              <label><input type="checkbox" id="pollMulti"> 複数回答を許可する</label>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="startBtn" class="btn-primary">⚡ 実行</button>
          <button id="stopBtn" class="btn-danger">⛔ スパム停止</button>
          <button id="leaveBtn" class="btn-warning">🚪 サーバー退出</button>
        </div>

        <div id="spamLog" class="log"></div>
      </div>
    </div>

    <!-- ===== Token Checker ===== -->
    <div id="tabChecker" class="tab-content">
      <div class="card">
        <h2>🔍 Token Checker</h2>

        <div class="field">
          <label>チェックするトークン</label>
          <div class="token-input-wrapper">
            <textarea id="checkTokens" placeholder="カンマ / 改行 / スペースで区切る"></textarea>
            <button type="button" class="toggle-visibility" data-target="checkTokens">👁️</button>
          </div>
        </div>

        <button id="checkTokensBtn" class="btn-primary">🔍 チェック</button>

        <div id="tokenCheckResult" class="token-result"></div>

        <div id="checkerLog" class="log"></div>

        <div class="checker-stats">
          <span>✅ 有効: <span id="validCount">0</span></span>
          <span>📱 電話制限: <span id="lockedCount">0</span></span>
          <span>❌ 無効: <span id="invalidCount">0</span></span>
        </div>
      </div>
    </div>

    <div id="status" class="status">⚠ トークンを入力してください</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
