<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSPC Web Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- ===== ヘッダー ===== -->
    <div class="header">
      <h1>⚡ SSPC Web Tools</h1>
      <p class="subtitle">— Advanced Discord Suite —</p>
    </div>

    <!-- ===== タブナビゲーション ===== -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tabChecker">🔍 Token Checker</button>
      <button class="tab-btn" data-tab="tabRaid">⚔️ Raid Tool</button>
    </div>

    <!-- ========================================================== -->
    <!-- タブ1: Token Checker -->
    <!-- ========================================================== -->
    <div id="tabChecker" class="tab-content active">
      <div class="card">
        <h2>🔍 Token Checker</h2>
        <p class="tab-desc">トークンの有効性をチェックします</p>

        <div class="field">
          <label>チェックするトークン</label>
          <textarea id="checkTokens" placeholder="カンマ / 改行 / スペースで区切る"></textarea>
        </div>

        <button id="checkTokensBtn" class="btn-primary">🔍 チェック</button>

        <div id="tokenCheckResult" class="token-result"></div>

        <div class="checker-stats">
          <span>✅ 有効: <span id="validCount">0</span></span>
          <span>📱 電話制限: <span id="lockedCount">0</span></span>
          <span>❌ 無効: <span id="invalidCount">0</span></span>
        </div>
      </div>
    </div>

    <!-- ========================================================== -->
    <!-- タブ2: Raid Tool -->
    <!-- ========================================================== -->
    <div id="tabRaid" class="tab-content">
      <div class="card">
        <h2>⚔️ Raid Tool</h2>
        <p class="tab-desc">複数トークンでチャンネルへメッセージを送信、メンション、投票などをまとめて行えます。</p>

        <!-- ===== トークン ===== -->
        <div class="field">
          <label>トークン</label>
          <textarea id="raidTokens" placeholder="カンマ / 改行 / スペースで区切る"></textarea>
        </div>

        <!-- ===== サーバーID ===== -->
        <div class="field">
          <label>サーバーID</label>
          <input id="guildId" placeholder="123456789012345678">
        </div>

        <!-- ===== チャンネルID ===== -->
        <div class="field">
          <label>チャンネルID</label>
          <textarea id="channelIds" placeholder="カンマ / 改行 / スペースで区切る"></textarea>
          <button id="autoChannel" class="btn-secondary">📡 チャンネル自動取得</button>
        </div>

        <!-- ===== メッセージ内容 ===== -->
        <div class="field">
          <label>メッセージ内容</label>
          <textarea id="message" placeholder="送信するメッセージを入力"></textarea>
        </div>

        <!-- ===== 基本オプション ===== -->
        <div class="checkbox-group">
          <label><input type="checkbox" id="mentionEveryone"> 全体メンション</label>
          <label><input type="checkbox" id="randomize"> ランダマイズ</label>
        </div>

        <!-- ========================================================== -->
        <!-- アコーディオン1: 送信設定 -->
        <!-- ========================================================== -->
        <div class="accordion">
          <div class="accordion-header" data-target="accordionSettings">
            <span>▶ 送信設定</span>
          </div>
          <div class="accordion-body" id="accordionSettings">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="settingsEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">送信設定を有効にする</span>
            </div>
            <div class="row">
              <div class="field">
                <label>送信間隔 (MS)</label>
                <input id="sendInterval" type="number" value="1000">
              </div>
              <div class="field">
                <label>メッセージ間遅延 (MS)</label>
                <input id="messageDelay" type="number" value="500">
              </div>
            </div>
            <div class="field">
              <label>RATE LIMIT RETRY</label>
              <input id="rateLimitRetry" type="number" value="3">
            </div>
            <div class="field">
              <label>送信上限 (0=無制限)</label>
              <input id="limit" type="number" value="0">
            </div>
          </div>
        </div>

        <!-- ========================================================== -->
        <!-- アコーディオン2: ユーザーメンション -->
        <!-- ========================================================== -->
        <div class="accordion">
          <div class="accordion-header" data-target="accordionMention">
            <span>▶ ユーザーメンション</span>
          </div>
          <div class="accordion-body" id="accordionMention">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="mentionEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">ユーザーメンションを有効にする</span>
            </div>
            <div class="field">
              <label>USER ID</label>
              <textarea id="userIds" placeholder="改行区切り"></textarea>
            </div>
            <div class="row">
              <div class="field">
                <label>MESSAGE LIMIT</label>
                <input id="messageLimit" type="number" value="100">
              </div>
              <div class="field">
                <label>1メッセージあたりのメンション数</label>
                <input id="mentionsPerMessage" type="number" value="1">
              </div>
            </div>
            <button id="autoUsers" class="btn-secondary">👥 User ID 自動取得</button>
            <div class="checkbox-group">
              <label><input type="checkbox" id="randomMention"> RANDOM MENTION</label>
            </div>
            <button id="mentionStartBtn" class="btn-primary">👥 メンション実行</button>
          </div>
        </div>

        <!-- ========================================================== -->
        <!-- アコーディオン3: リプライ設定 -->
        <!-- ========================================================== -->
        <div class="accordion">
          <div class="accordion-header" data-target="accordionReply">
            <span>▶ リプライ設定</span>
          </div>
          <div class="accordion-body" id="accordionReply">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="replyEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">リプライ設定を有効にする</span>
            </div>
            <div class="field">
              <label>過去何メッセージまで参照するか</label>
              <input id="replyHistoryLimit" type="number" value="50">
            </div>
            <div class="checkbox-group">
              <label><input type="checkbox" id="randomReply"> RANDOM REPLY</label>
            </div>
            <div class="field">
              <label>カスタムリプライ文言（任意）</label>
              <input id="replyCustomText" placeholder="デフォルト: メッセージ内容をそのまま引用">
            </div>
          </div>
        </div>

        <!-- ========================================================== -->
        <!-- アコーディオン4: 投票 -->
        <!-- ========================================================== -->
        <div class="accordion">
          <div class="accordion-header" data-target="accordionPoll">
            <span>▶ 投票</span>
          </div>
          <div class="accordion-body" id="accordionPoll">
            <div class="toggle-row">
              <label class="toggle-switch">
                <input type="checkbox" id="pollEnabled">
                <span class="toggle-slider"></span>
              </label>
              <span class="toggle-label">投票を有効にする</span>
            </div>
            <button id="addPollBtn" class="btn-secondary">➕ 投票を追加</button>
            <div id="pollContainer">
              <div class="poll-item">
                <div class="field">
                  <label>❓ 質問</label>
                  <input class="poll-question" value="Vote now!">
                </div>
                <div class="field">
                  <label>📝 選択肢（改行区切り）</label>
                  <textarea class="poll-options" rows="3">Yes&#10;No</textarea>
                </div>
                <div class="checkbox-group">
                  <label><input type="checkbox" class="poll-multi"> 複数選択可</label>
                </div>
              </div>
            </div>
            <button id="pollStartBtn" class="btn-primary">📊 投票を実行</button>
          </div>
        </div>

        <!-- ===== アクションボタン ===== -->
        <div class="actions">
          <button id="startBtn" class="btn-primary">⚡ 実行</button>
          <button id="stopBtn" class="btn-danger">⛔ スパム停止</button>
          <button id="leaveBtn" class="btn-warning">🚪 サーバー退出</button>
        </div>
      </div>
    </div>

    <!-- ===== ステータス & ログ ===== -->
    <div id="status" class="status">⚠ トークンを入力してください</div>
    <div id="log" class="log"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
